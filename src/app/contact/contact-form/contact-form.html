<div class="child-card">
  <span class="badge">Child Component</span>
  <h3>{{ headerTitle() }}</h3>
  <p class="child-desc">
    This form lives inside a child component. Submitting it triggers an
    <strong>output event</strong>
    which acts like a React callback prop.
  </p>

  <form (submit)="onSubmit($event)">
    <div class="form-group">
      <label for="contact-name">Name</label>
      <input
        id="contact-name"
        type="text"
        class="form-control"
        placeholder="Your Name"
        required
        #nameInput
      />
    </div>
    <div class="form-group">
      <label for="contact-email">Email</label>
      <input
        id="contact-email"
        type="email"
        class="form-control"
        placeholder="Your Email"
        required
        #emailInput
      />
    </div>
    <div class="form-group">
      <label for="contact-msg">Message</label>
      <textarea
        id="contact-msg"
        class="form-control"
        rows="3"
        placeholder="Your Message..."
        required
        #msgInput
      ></textarea>
    </div>
    <button type="submit" class="btn btn-submit">Submit Message</button>
  </form>
</div>
