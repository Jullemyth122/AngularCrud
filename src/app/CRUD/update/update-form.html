<div class="update-card">
  <div class="update-header">
    <span class="update-badge">Edit Mode</span>
    <span class="uid-label">{{ item().random_uid }}</span>
  </div>

  <form (submit)="onSave($event)">
    <div class="form-group">
      <label for="edit-name">Full Name</label>
      <input
        id="edit-name"
        type="text"
        class="form-control"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        required
      />
    </div>

    <div class="form-group">
      <label for="edit-email">Email Address</label>
      <input
        id="edit-email"
        type="email"
        class="form-control"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        required
      />
    </div>

    <div class="form-group-row">
      <div class="form-group">
        <label for="edit-age">Age</label>
        <input
          id="edit-age"
          type="number"
          min="1"
          max="120"
          class="form-control"
          [value]="age()"
          (input)="age.set(+$any($event.target).value)"
          required
        />
      </div>

      <div class="form-group">
        <label for="edit-location">Location</label>
        <input
          id="edit-location"
          type="text"
          class="form-control"
          [value]="location()"
          (input)="location.set($any($event.target).value)"
          required
        />
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn btn-save">Save Changes</button>
    </div>
  </form>
</div>
