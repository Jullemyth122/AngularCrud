<header class="app-header">
  <div class="header-container">
    <div class="logo">
      <!-- Custom Exe logo: terminal prompt + bracket mark -->
      <svg class="logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Exe logo">
        <rect width="36" height="36" rx="9" fill="#0f172a"/>
        <!-- Terminal > prompt -->
        <polyline points="8,12 14,18 8,24" stroke="#3b82f6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Underscore cursor -->
        <line x1="17" y1="24" x2="28" y2="24" stroke="#3b82f6" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <div class="logo-brand">
        <span class="logo-name">Exe</span>
        <span class="logo-tagline">Angular · React</span>
      </div>
    </div>
    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/about" routerLinkActive="active">About Me</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
      <a routerLink="/crud" routerLinkActive="active">CRUD App</a>
    </nav>
  </div>
</header>

<main class="app-main">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="app-footer">
  <div class="footer-container">
    <p>Exe &bull; Angular Core Concepts &bull; Built with Angular v22</p>
  </div>
</footer>
